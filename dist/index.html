sa dibatalkan. Untuk PC Gaming, pembatalan bisa dilakukan maksimal 2 jam setelah pembayaran atau sebelum proses perakitan dimulai (dikenakan biaya admin 5%)."},{category:"Pemesanan",question:"Berapa lama proses verifikasi pembayaran?",answer:"Pembayaran via Midtrans, Xendit, OVO, GoPay, QRIS dll: VERIFIKASI INSTANT (otomatis). Transfer bank manual: 5-30 menit setelah konfirmasi via WhatsApp."},{category:"Produk Software",question:"Apakah lisensi software berlaku selamanya?",answer:'YA! Semua software kami menggunakan model "Lifetime License" - sekali bayar, gunakan selamanya untuk 1 device/akun. Anda juga mendapat free update software seumur hidup.'},{category:"Produk Software",question:"Bagaimana cara menerima software setelah pembayaran?",answer:"Setelah pembayaran terverifikasi, kami akan mengirimkan: (1) Link download software, (2) License key/aktivasi, (3) Tutorial penggunaan, (4) Akses grup support. Semua dikirim via email & WhatsApp dalam 15 menit - 2 jam."},{category:"Produk Software",question:"Bisakah saya install software di banyak perangkat?",answer:"1 lisensi = 1 device. Jika ingin install di device lain, Anda perlu beli lisensi tambahan atau request transfer lisensi (gratis 1x untuk pindah device)."},{category:"Produk Software",question:"Apakah aman menggunakan WhatsApp/Telegram Blast tools?",answer:"Software kami dilengkapi smart delay system & anti-ban technology untuk meminimalisir resiko banned. Namun penggunaan tetap menjadi tanggung jawab user. Ikuti tutorial penggunaan yang kami berikan untuk hasil terbaik."},{category:"Produk Software",question:"Software berjalan di OS apa saja?",answer:"TBPROMOB & WABPROMOB: Android (min. v7.0). WhatsApp SuperBlast & WBlaster Pro: Windows, RDP, Mac (Parallels). InstaRobo & Telegram Blast V2: Windows. Cek detail di halaman produk."},{category:"Produk Software",question:"Apa beda WhatsApp SuperBlast vs BotMaster?",answer:"WhatsApp SuperBlast: Fokus mass blast/promosi dengan multi RDP support. BotMaster WhatsApp Solution: Fokus customer service automation, scrape group, anti-ban yang lebih canggih. Pilih sesuai kebutuhan bisnis Anda."},{category:"PC Gaming",question:"Berapa lama proses perakitan PC?",answer:"Setelah pembayaran terverifikasi, perakitan PC membutuhkan 1-3 hari kerja, plus burn-in test 24 jam untuk memastikan stabilitas. Total dari order ke pengiriman: 3-5 hari kerja."},{category:"PC Gaming",question:"Apakah PC sudah include OS Windows?",answer:"Untuk paket Standard, Windows 10/11 sudah pre-installed (versi trial). Anda bisa upgrade ke Windows 11 Pro Original (+Rp 1.500.000) atau gunakan license sendiri."},{category:"PC Gaming",question:"Berapa garansi PC Gaming?",answer:"Garansi resmi 1 TAHUN untuk semua komponen utama (processor, motherboard, RAM, VGA, SSD). Garansi service 3 bulan untuk troubleshoot/setting. Garansi tidak berlaku untuk kerusakan akibat kelalaian/tegangan listrik tidak stabil."},{category:"PC Gaming",question:"Bisakah custom spek PC?",answer:"BISA! Hubungi kami via WhatsApp dengan detail kebutuhan Anda (budget, kegunaan, game yang dimainkan). Tim kami akan recommend build terbaik sesuai budget. Custom build butuh waktu 5-7 hari kerja."},{category:"PC Gaming",question:"Apakah ada layanan COD untuk PC?",answer:"COD (Cash on Delivery) hanya tersedia untuk area Jabodetabek dengan minimum order Rp 5.000.000. Customer akan dihubungi tim untuk konfirmasi alamat dan jadwal pengiriman."},{category:"Pembayaran",question:"Metode pembayaran apa saja yang diterima?",answer:"Kami menerima 10+ metode pembayaran: Kartu Kredit/Debit (Visa, Master, JCB), Virtual Account (BCA, Mandiri, BNI, BRI, Permata), E-Wallet (GoPay, OVO, DANA, ShopeePay, LinkAja), QRIS, Convenience Store (Indomaret, Alfamart), dan Transfer Bank Manual. Diproses melalui Midtrans, Xendit, Ayolinx, dan gateway terpercaya lainnya."},{category:"Pembayaran",question:"Apakah pembayaran di PCBeerBeer aman?",answer:"SANGAT AMAN. Semua transaksi diproses melalui Payment Gateway berlisensi resmi BI
